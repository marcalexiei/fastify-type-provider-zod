name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  # queue every push: without it, a newer run replaces the waiting one and that release is skipped
  queue: max

permissions: {}

env:
  HUSKY: 0

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: read # the app token, not GITHUB_TOKEN, pushes the release and opens the PR
      id-token: write # added for provenance

    outputs:
      published: ${{ steps.result.outputs.published }}

    steps:
      - name: Create release helper token
        id: release-helper
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_HELPER_APP_ID }}
          private-key: ${{ secrets.RELEASE_HELPER_PRIVATE_KEY }}
          permission-contents: write # pushes the release branch, tags and releases
          permission-pull-requests: write # opens and updates the release PR

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@2c28f768b03ce332a96804ae076f15c84f239684 # v4.0.2

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.release-helper.outputs.token }}
          commit-message: 'chore: release'
          pr-title: 'chore: release'
          publish-script: 'pnpm release'

      - name: Output changeset result
        id: result
        if: ${{ steps.changesets.outputs['has-changesets'] == 'false' }}
        run: echo "published=true" >> "$GITHUB_OUTPUT"

  documentation-build:
    name: Documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - release
    if: ${{ needs.release.outputs.published }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@2c28f768b03ce332a96804ae076f15c84f239684 # v4.0.2

      - name: Build with VitePress
        run: pnpm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  documentation-deploy:
    name: Documentation deploy
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs:
      - release
      - documentation-build
    if: ${{ needs.release.outputs.published }}

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: Documentation
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
